{%- comment -%} App row on the Apps page. Usage: {% include app-list-item.html app=app %} {%- endcomment -%}
{%- assign app = include.app -%}
<li>
                    <div class="index-row app-item">
                        <img class="index-logo" src="{{ app.logo | relative_url }}" alt="" width="40" height="40">
                        <span class="index-name">{{ app.name }}</span>
                        <span class="index-desc">{{ app.about }}</span>
                        {% include store-links.html app=app long=true %}
                    </div>
                </li>
