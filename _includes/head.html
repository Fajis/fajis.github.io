{%- assign description = page.description | default: site.description -%}
{%- assign social_title = page.social_title | default: page.title -%}
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | escape }}</title>
    <meta name="description" content="{{ description | strip | escape }}">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
    {%- if page.noindex %}
    <meta name="robots" content="noindex">
    {%- else %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ social_title | escape }}">
    <meta property="og:description" content="{{ page.social_description | default: description | strip | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ '/og-image.png' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ site.brand }} — I build PHP backends, React Native apps and MySQL databases.">
    <meta property="og:site_name" content="{{ site.brand }}">
    <meta name="twitter:card" content="summary_large_image">
    {%- endif %}
    {%- if page.person_schema %}
    {% include person-schema.html %}
    {%- endif %}
    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script>
        // Before first paint: enable motion styles and apply the saved theme
        document.documentElement.classList.add('js');
        try {
            var theme = localStorage.getItem('theme');
            if (theme) document.documentElement.dataset.theme = theme;
        } catch (e) {}
    </script>
